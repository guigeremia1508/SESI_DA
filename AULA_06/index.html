<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Completa</title>
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Campo do Primeiro Número -->
    <input id="campo1" type="text" value="0">

    <!-- Campo de Seleção da Operação -->
    <select id="operacao">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <!-- Campo do Segundo Número -->
    <input id="campo2" type="text" value="0">
    
    <!-- Botão atualizado chamando a nova função geral -->
    <button onclick="calcular()">calcular</button>

    <h1 id="resultado">Resultado: 0</h1>

</body>
</html>
