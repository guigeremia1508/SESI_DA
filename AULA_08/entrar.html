<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
</head>
<body>
    <a id="voltarLogin" href="login.html">Voltar</a>
    <h2 id="tituloEntrar">Entrar</h2>
    <form id="formularioLogin" onsubmit="entrar(event)">
        <label for="loginUsuario">Usuário</label>
        <input type="text" id="loginUsuario" required>
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" required>
        <button type="submit">Entrar</button>
    </form>
    <div id="linksLogin">
        <a href="recuperar-senha.html">Esqueci minha senha</a>
    </div>
    <div id="loginFeito" hidden>
        <p>Login feito.</p>
        <button type="button" onclick="window.location.href='conta.html'">Editar conta</button>
    </div>
    <p id="mensagem"></p>
    <script src="script.js"></script>
</body>
</html>
